[project]
name = 'phos-ml'
version = '0.1.0'
description = 'PhoS nn model'
authors = [
    { name = "Alex Spirin" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "datasets==5.0.1",
    "ipykernel>=7.4.0",
    "mlflow==3.5.1",
    "polars==2.0.0",
    "python-dotenv==1.2.4",
    "sentencepiece==0.2.2",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers==5.20.1",
    "ipywidgets==8.1.9",
    "tqdm==4.70.1",
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["utility*"]

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
show-fixes = true
fix = true
target-version = "py312"

[tool.ruff.lint]
select = ['E', 'W', 'F', 'I']
fixable = ['ALL']

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
addopts = "-v -ra --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
